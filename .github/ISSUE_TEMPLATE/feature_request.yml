name: Feature request
description: Suggest something NoiseFree should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation, not the solution. "My keyboard clicks still come through on Zoom" beats "add a keyboard filter".
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How do you picture it working?
