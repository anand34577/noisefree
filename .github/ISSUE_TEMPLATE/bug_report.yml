name: Bug report
description: Something doesn't work the way the docs say it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows 11, Windows 10, macOS, Linux (PulseAudio), Linux (PipeWire)]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: NoiseFree version
      description: Shown under Settings → About.
      placeholder: "1.0.1"
  - type: input
    id: processor
    attributes:
      label: "\"Run the AI model on\" setting"
      description: And the line underneath it, e.g. "Running on GPU (DirectML)."
  - type: textarea
    id: devices
    attributes:
      label: Microphone and meeting app
      description: Which mic you picked in NoiseFree, and which app (Teams, Zoom, Discord…) you're using it in.
