[project]
name = "noisefree"
version = "1.0.0"
description = "Removes background noise from your microphone and exposes a clean virtual microphone."
requires-python = ">=3.10"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
