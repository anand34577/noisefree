<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="kit.css">
<style>
  body { width: 1440px; height: 900px; position: relative; display: flex; justify-content: center; align-items: center; gap: 40px; }
  .step { display: flex; flex-direction: column; align-items: center; gap: 18px; }
  .label { font-size: 17px; font-weight: 600; color: var(--muted-light); }
  .label b { color: var(--teal-700); margin-right: 6px; }
  .arrow { width: 56px; height: 56px; flex: none; margin-top: 40px; }
</style></head>
<body class="bg-light grid">
  <div class="step"><div class="label"><b>1</b>First launch</div><div class="win light" data-src="app/setup-light.png"></div></div>
  <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="#0F766E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>
  <div class="step"><div class="label"><b>2</b>VB-CABLE installed</div><div class="win light" data-src="app/home-light.png"></div></div>
  <script src="kit.js"></script>
</body></html>
