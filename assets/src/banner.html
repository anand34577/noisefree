<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="kit.css">
<style>
  body { width: 1600px; height: 400px; position: relative; display: flex; align-items: center; padding: 0 80px; gap: 40px; }
  .left { width: 640px; flex: none; position: relative; }
  .name { font-size: 76px; margin: 0; }
  .pitch { font-size: 25px; margin: 18px 0 26px; max-width: 600px; }
  .wave { position: relative; flex: none; }
</style></head>
<body class="bg-dark grid">
  <div class="left">
    <div class="brand"><img src="../logo.svg" width="72" height="72" alt=""><h1 class="name">NoiseFree</h1></div>
    <p class="pitch">Removes background noise from your mic as you talk. Meeting apps get the clean version.</p>
    <div class="chips"><span class="chip">Windows</span><span class="chip">macOS</span><span class="chip">Linux</span><span class="chip">Runs on your GPU or CPU</span></div>
  </div>
  <svg class="wave" width="780" height="240" data-bars="58" data-hub="50"></svg>
  <script src="kit.js"></script>
</body></html>
